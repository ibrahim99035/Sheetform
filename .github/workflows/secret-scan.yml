name: Secret Scan

on:
  push:
    branches: [main, feature/ahmed]
  pull_request:
    branches: [main, feature/ahmed]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for hardcoded secrets
        run: |
          # Scan for common secret patterns (excluding node_modules and .git)
          PATTERNS=(
            'sk_live_'
            'sk_test_'
            'AKIA[0-9A-Z]{16}'
            'eyJ[A-Za-z0-9_-]*\.eyJ[A-Za-z0-9_-]*\.'
            'password\s*[:=]\s*["\x27][^"\x27]{8,}'
            'secret\s*[:=]\s*["\x27][^"\x27]{8,}'
            'api[_-]?key\s*[:=]\s*["\x27][^"\x27]{8,}'
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(rg -i "$pattern" --glob '!node_modules' --glob '!.git' --glob '!*.lock' --glob '!package-lock.json' -l 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "⚠️  Pattern '$pattern' found in:"
              echo "$MATCHES"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "❌ Potential secrets detected. Please review and remove them."
            exit 1
          fi

          echo "✅ No secrets detected"
